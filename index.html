<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at center, #071b35 0%, #020711 55%, #00030a 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 550px;
            height: 550px;
            background: #008cff;
            filter: blur(180px);
            opacity: 0.17;
            border-radius: 50%;
            pointer-events: none;
        }

        .system {
            width: 92%;
            max-width: 650px;
            max-height: 94vh;
            overflow-y: auto;
            padding: 30px;

            background: rgba(0, 110, 255, 0.08);

            border: 1px solid rgba(0, 160, 255, 0.65);

            border-radius: 20px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 0 20px rgba(0, 140, 255, 0.25),
                0 0 60px rgba(0, 100, 255, 0.12);

            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.94);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .title {
            text-align: center;
            font-size: 31px;
            letter-spacing: 5px;
            color: #69c7ff;

            text-shadow:
                0 0 10px #008cff,
                0 0 25px #006eff;

            margin-bottom: 28px;
        }

        .player {
            padding: 20px;

            background: rgba(0, 120, 255, 0.07);

            border: 1px solid rgba(0, 153, 255, 0.3);

            border-radius: 15px;
        }

        .player-name {
            font-size: 20px;
            color: #8ed7ff;
            margin-bottom: 18px;
        }

        .info {
            display: flex;
            justify-content: space-between;

            padding: 10px 0;

            border-bottom: 1px solid rgba(0, 153, 255, 0.12);
        }

        .info:last-child {
            border-bottom: none;
        }

        .label {
            color: #8aa7c4;
        }

        .value {
            color: #ffffff;
            font-weight: bold;

            text-shadow:
                0 0 8px #008cff;
        }

        .xp {
            margin-top: 20px;
        }

        .xp-top {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #a9c8e5;
        }

        .xp-bar {
            width: 100%;
            height: 11px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(0, 153, 255, 0.3);

            border-radius: 20px;

            overflow: hidden;
        }

        .xp-fill {
            width: 35%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #006eff,
                    #00bfff
                );

            box-shadow:
                0 0 10px #008cff,
                0 0 20px #008cff;

            transition: width 0.4s ease;
        }

        .stats {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 12px;

            margin-top: 20px;
        }

        .stat {
            padding: 15px;

            text-align: center;

            background: rgba(0, 120, 255, 0.06);

            border: 1px solid rgba(0, 153, 255, 0.25);

            border-radius: 12px;

            transition: 0.25s;
        }

        .stat:hover {
            border-color: #008cff;

            box-shadow:
                0 0 15px rgba(0, 140, 255, 0.3);

            transform: translateY(-2px);
        }

        .stat-name {
            color: #7899b8;
            font-size: 13px;
        }

        .stat-value {
            margin-top: 6px;

            font-size: 22px;

            color: #65c8ff;

            text-shadow:
                0 0 10px #008cff;
        }

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 25px;
        }

        .system-button {
            padding: 13px 8px;

            color: #8ed7ff;

            background: rgba(0, 110, 255, 0.08);

            border: 1px solid rgba(0, 153, 255, 0.4);

            border-radius: 10px;

            cursor: pointer;

            transition: 0.25s;

            font-size: 14px;
        }

        .system-button:hover {
            color: white;

            background:
                rgba(0, 130, 255, 0.2);

            border-color: #00aaff;

            box-shadow:
                0 0 15px rgba(0, 153, 255, 0.45);

            transform: translateY(-2px);
        }

        .system-message {
            margin-top: 23px;

            padding: 14px;

            text-align: center;

            color: #79d0ff;

            background:
                rgba(0, 120, 255, 0.06);

            border:
                1px solid rgba(0, 153, 255, 0.25);

            border-radius: 10px;

            text-shadow:
                0 0 8px #008cff;

            min-height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .xp-button {
            width: 100%;

            margin-top: 12px;

            padding: 12px;

            background:
                rgba(0, 140, 255, 0.12);

            border:
                1px solid rgba(0, 170, 255, 0.45);

            color: #8ed7ff;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.25s;
        }

        .xp-button:hover {
            background:
                rgba(0, 140, 255, 0.22);

            box-shadow:
                0 0 18px rgba(0, 153, 255, 0.35);
        }

        @media (max-width: 600px) {

            body {
                overflow-y: auto;
                padding: 10px 0;
            }

            .system {
                width: 94%;
                max-height: none;
                padding: 20px;
            }

            .title {
                font-size: 25px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <div class="system">

        <div class="title">
            SYSTEM
        </div>

        <div class="player">

            <div class="player-name">
                PLAYER
            </div>

            <div class="info">
                <span class="label">
                    LEVEL
                </span>

                <span
                    class="value"
                    id="level">
                    01
                </span>
            </div>

            <div class="info">
                <span class="label">
                    RANK
                </span>

                <span
                    class="value"
                    id="rank">
                    E
                </span>
            </div>

            <div class="info">
                <span class="label">
                    COINS
                </span>

                <span
                    class="value"
                    id="coins">
                    0
                </span>
            </div>

            <div class="xp">

                <div class="xp-top">

                    <span>
                        XP
                    </span>

                    <span id="xpText">
                        35 / 100
                    </span>

                </div>

                <div class="xp-bar">

                    <div
                        class="xp-fill"
                        id="xpFill">
                    </div>

                </div>

            </div>

        </div>

        <div class="stats">

            <div class="stat">

                <div class="stat-name">
                    STRENGTH
                </div>

                <div
                    class="stat-value"
                    id="strength">
                    10
                </div>

            </div>

            <div class="stat">

                <div class="stat-name">
                    AGILITY
                </div>

                <div
                    class="stat-value"
                    id="agility">
                    10
                </div>

            </div>

            <div class="stat">

                <div class="stat-name">
                    VITALITY
                </div>

                <div
                    class="stat-value"
                    id="vitality">
                    10
                </div>

            </div>

            <div class="stat">

                <div class="stat-name">
                    INTELLIGENCE
                </div>

                <div
                    class="stat-value"
                    id="intelligence">
                    10
                </div>

            </div>

        </div>

        <div class="buttons">

            <button
                class="system-button"
                onclick="showStatus()">
                STATUS
            </button>

            <button
                class="system-button"
                onclick="showQuest()">
                QUESTS
            </button>

            <button
                class="system-button"
                onclick="showRewards()">
                REWARDS
            </button>

        </div>

        <button
            class="xp-button"
            onclick="addXP(25)">
            +25 XP
        </button>

        <div
            class="system-message"
            id="systemMessage">

            SYSTEM ONLINE

        </div>

    </div>

    <script>

        let player = JSON.parse(
            localStorage.getItem("systemPlayer")
        ) || {

            level: 1,

            xp: 35,

            coins: 0,

            strength: 10,

            agility: 10,

            vitality: 10,

            intelligence: 10

        };

        const maxXP = 100;


        function getRank(level) {

            if (level >= 50) {
                return "S";
            }

            if (level >= 35) {
                return "A";
            }

            if (level >= 25) {
                return "B";
            }

            if (level >= 15) {
                return "C";
            }

            if (level >= 5) {
                return "D";
            }

            return "E";
        }


        function savePlayer() {

            localStorage.setItem(
                "systemPlayer",
                JSON.stringify(player)
            );

        }


        function updateSystem() {

            document.getElementById(
                "level"
            ).textContent =
                String(player.level)
                    .padStart(2, "0");


            document.getElementById(
                "rank"
            ).textContent =
                getRank(player.level);


            document.getElementById(
                "coins"
            ).textContent =
                player.coins;


            document.getElementById(
                "xpText"
            ).textContent =
                player.xp + " / " + maxXP;


            document.getElementById(
                "xpFill"
            ).style.width =
                (player.xp / maxXP * 100) + "%";


            document.getElementById(
                "strength"
            ).textContent =
                player.strength;


            document.getElementById(
                "agility"
            ).textContent =
                player.agility;


            document.getElementById(
                "vitality"
            ).textContent =
                player.vitality;


            document.getElementById(
                "intelligence"
            ).textContent =
                player.intelligence;


            savePlayer();

        }


        function addXP(amount) {

            player.xp += amount;

            let leveledUp = false;

            while (player.xp >= maxXP) {

                player.xp -= maxXP;

                player.level++;

                player.coins += 25;

                player.strength++;

                player.agility++;

                player.vitality++;

                player.intelligence++;

                leveledUp = true;

            }


            if (leveledUp) {

                document.getElementById(
                    "systemMessage"
                ).textContent =
                    "LEVEL UP! — LEVEL " +
                    player.level;

            } else {

                document.getElementById(
                    "systemMessage"
                ).textContent =
                    "+" + amount +
                    " XP ACQUIRED";

            }


            updateSystem();

        }


        function showStatus() {

            document.getElementById(
                "systemMessage"
            ).textContent =
                "STATUS — LEVEL " +
                player.level +
                " — RANK " +
                getRank(player.level);

        }


        function showQuest() {

            document.getElementById(
                "systemMessage"
            ).textContent =
                "QUESTS — NO ACTIVE QUESTS";

        }


        function showRewards() {

            document.getElementById(
                "systemMessage"
            ).textContent =
                "REWARDS — " +
                player.coins +
                " COINS";

        }


        updateSystem();

    </script>

</body>

</html>
