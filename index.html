<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(
            ellipse at 50% 15%,
            rgba(0, 145, 255, 0.30),
            transparent 42%
        ),
        radial-gradient(
            ellipse at 15% 75%,
            rgba(0, 80, 255, 0.18),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 85% 70%,
            rgba(0, 180, 255, 0.13),
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #00040b,
            #020d1c 45%,
            #00040b
        );
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
}

.glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .35;
}

.glow.one {
    width: 420px;
    height: 420px;
    background: #0077ff;
    top: -150px;
    left: 30%;
}

.glow.two {
    width: 350px;
    height: 350px;
    background: #0044ff;
    bottom: -120px;
    left: -80px;
}

.glow.three {
    width: 300px;
    height: 300px;
    background: #00aaff;
    right: -100px;
    bottom: 10%;
}

/* LIGHT LINES */

.light-line {
    position: absolute;
    width: 120%;
    height: 1px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(0,180,255,.35),
        transparent
    );
    transform: rotate(-18deg);
}

.line1 {
    top: 25%;
    left: -10%;
}

.line2 {
    top: 60%;
    left: -10%;
    opacity: .5;
}

/* GRID */

.grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(0,150,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,150,255,.035) 1px,
            transparent 1px
        );

    background-size: 70px 70px;

    mask-image:
        radial-gradient(
            circle,
            black 15%,
            transparent 80%
        );
}

/* MAIN */

.system {
    width: min(1100px, 92%);
    margin: 50px auto;
}

/* HEADER */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 20px 25px;

    background:
        linear-gradient(
            135deg,
            rgba(0,100,180,.16),
            rgba(0,10,25,.55)
        );

    border: 1px solid rgba(0,170,255,.35);

    backdrop-filter: blur(18px);

    box-shadow:
        0 0 30px rgba(0,100,255,.10);
}

.system-logo {
    font-size: 26px;
    letter-spacing: 8px;

    color: #8cddff;

    text-shadow:
        0 0 10px #008cff,
        0 0 30px rgba(0,140,255,.7);
}

.status {
    color: #59caff;
    font-size: 12px;
    letter-spacing: 3px;
}

/* PLAYER */

.player {
    margin-top: 20px;

    display: grid;
    grid-template-columns: 1.4fr 1fr;

    gap: 20px;
}

.panel {
    position: relative;

    padding: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(0,85,150,.17),
            rgba(0,8,20,.62)
        );

    border: 1px solid rgba(0,170,255,.30);

    backdrop-filter: blur(20px);

    box-shadow:
        inset 0 0 30px rgba(0,130,255,.025),
        0 0 30px rgba(0,80,150,.08);
}

/* CORNERS */

.panel::before,
.panel::after {
    content: "";
    position: absolute;
    width: 35px;
    height: 35px;
}

.panel::before {
    top: -1px;
    left: -1px;

    border-top: 2px solid #00aaff;
    border-left: 2px solid #00aaff;
}

.panel::after {
    right: -1px;
    bottom: -1px;

    border-right: 2px solid #00aaff;
    border-bottom: 2px solid #00aaff;
}

.label {
    color: #5dbde6;
    font-size: 11px;
    letter-spacing: 3px;
}

.player-name {
    margin-top: 8px;

    font-size: 38px;
    font-weight: bold;

    text-shadow:
        0 0 15px rgba(0,150,255,.5);
}

.level {
    margin-top: 8px;

    color: #86dfff;
}

/* XP */

.xp {
    margin-top: 30px;
}

.xp-info {
    display: flex;
    justify-content: space-between;

    margin-bottom: 8px;

    color: #9bdfff;
    font-size: 13px;
}

.xp-bar {
    height: 8px;

    background: rgba(0,20,40,.9);

    border: 1px solid rgba(0,140,255,.25);
}

.xp-fill {
    width: 63%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #006eff,
            #00d5ff
        );

    box-shadow:
        0 0 15px #008cff;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-top: 20px;
}

.stat {
    padding: 18px;

    background: rgba(0,70,120,.09);

    border: 1px solid rgba(0,150,255,.18);

    text-align: center;
}

.stat-name {
    color: #63bce4;
    font-size: 11px;
    letter-spacing: 2px;
}

.stat-number {
    margin-top: 8px;

    font-size: 28px;

    color: white;

    text-shadow:
        0 0 12px rgba(0,150,255,.5);
}

/* RIGHT PANEL */

.rank {
    text-align: center;
    padding: 15px;
}

.rank-title {
    color: #5dbde6;
    letter-spacing: 3px;
    font-size: 12px;
}

.rank-value {
    margin-top: 10px;

    font-size: 80px;

    color: #dff8ff;

    text-shadow:
        0 0 10px #008cff,
        0 0 40px #0077ff;
}

.coins {
    text-align: center;
    margin-top: 20px;
}

.coin-number {
    margin-top: 8px;

    font-size: 28px;

    color: #65d5ff;
}

/* BUTTONS */

.actions {
    margin-top: 20px;

    display: flex;
    gap: 12px;
}

button {
    padding: 13px 22px;

    background:
        linear-gradient(
            135deg,
            rgba(0,140,255,.18),
            rgba(0,50,100,.15)
        );

    border: 1px solid rgba(0,170,255,.45);

    color: white;

    cursor: pointer;

    letter-spacing: 2px;

    transition: .25s;
}

button:hover {
    background: rgba(0,150,255,.28);

    box-shadow:
        0 0 20px rgba(0,160,255,.4);

    transform: translateY(-2px);
}

/* LOWER */

.lower {
    margin-top: 20px;

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 20px;
}

.title {
    color: #68cefa;

    letter-spacing: 4px;

    font-size: 13px;

    margin-bottom: 20px;
}

.quest {
    padding: 15px;

    margin-bottom: 10px;

    border-left: 2px solid #008cff;

    background: rgba(0,70,120,.08);

    color: #c7ecff;
}

/* MOBILE */

@media(max-width:800px) {

    .player,
    .lower {
        grid-template-columns: 1fr;
    }

    .system {
        width: 94%;
        margin: 20px auto;
    }

    .player-name {
        font-size: 30px;
    }

    .rank-value {
        font-size: 60px;
    }
}

</style>
</head>

<body>

<div class="background">

    <div class="glow one"></div>
    <div class="glow two"></div>
    <div class="glow three"></div>

    <div class="light-line line1"></div>
    <div class="light-line line2"></div>

    <div class="grid"></div>

</div>


<div class="system">

    <header class="header">

        <div class="system-logo">
            SYSTEM
        </div>

        <div class="status">
            SYSTEM ONLINE
        </div>

    </header>


    <section class="player">

        <!-- PLAYER PANEL -->

        <div class="panel">

            <div class="label">
                PLAYER
            </div>

            <div class="player-name">
                PLAYER
            </div>

            <div class="level">
                LEVEL 01
            </div>


            <div class="xp">

                <div class="xp-info">

                    <span>EXPERIENCE</span>

                    <span>63 / 100</span>

                </div>

                <div class="xp-bar">

                    <div class="xp-fill"></div>

                </div>

            </div>


            <div class="stats">

                <div class="stat">

                    <div class="stat-name">
                        STRENGTH
                    </div>

                    <div class="stat-number">
                        10
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-name">
                        AGILITY
                    </div>

                    <div class="stat-number">
                        10
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-name">
                        VITALITY
                    </div>

                    <div class="stat-number">
                        10
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-name">
                        INTELLIGENCE
                    </div>

                    <div class="stat-number">
                        10
                    </div>

                </div>

            </div>

        </div>


        <!-- RANK PANEL -->

        <div class="panel">

            <div class="rank">

                <div class="rank-title">
                    CURRENT RANK
                </div>

                <div class="rank-value">
                    E
                </div>

            </div>


            <div class="coins">

                <div class="label">
                    SYSTEM COINS
                </div>

                <div class="coin-number">
                    0000
                </div>

            </div>


            <div class="actions">

                <button>
                    STATUS
                </button>

                <button>
                    QUESTS
                </button>

            </div>

        </div>

    </section>


    <section class="lower">

        <div class="panel">

            <div class="title">
                ACTIVE QUESTS
            </div>

            <div class="quest">
                Daily Training
            </div>

            <div class="quest">
                System Check
            </div>

            <div class="quest">
                First Mission
            </div>

        </div>


        <div class="panel">

            <div class="title">
                SYSTEM MESSAGE
            </div>

            <div class="quest">
                The system is waiting for your next action.
            </div>

            <div class="quest">
                Complete quests to gain experience.
            </div>

        </div>

    </section>

</div>

</body>
</html>
